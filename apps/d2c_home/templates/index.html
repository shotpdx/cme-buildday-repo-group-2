<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Streaming — Tonight's Your Night</title>
  <link rel="stylesheet" href="/static/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700;900&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
  <!-- Demo chrome: persona picker. In production, canonical_id would come from session auth. -->
  <header class="demo-bar">
    <div class="demo-bar__brand">
      <span class="demo-bar__logo">◆</span>
      <span class="demo-bar__title">STREAMPRIME</span>
      <span class="demo-bar__tag">Build Day demo</span>
    </div>
    <label class="demo-bar__picker">
      <span class="demo-bar__picker-label">Viewer</span>
      <select id="canonical-select">
        {% for demo in demo_ids %}
          <option value="{{ demo.canonical_id }}" data-persona="{{ demo.persona }}">
            {{ demo.label }}
          </option>
        {% endfor %}
      </select>
    </label>
  </header>

  <!-- Hero stage: Ken Burns image + copy overlay. 16:9, fills viewport. -->
  <main class="hero" aria-live="polite">
    <!-- Layer 1: image with Ken Burns (scale + pan via CSS keyframes, reset on each load) -->
    <div class="hero__stage">
      <img id="hero-image" class="hero__image" alt="" decoding="async" />
      <div class="hero__vignette" aria-hidden="true"></div>
      <div class="hero__scrim" aria-hidden="true"></div>
    </div>

    <!-- Layer 2: copy + CTA. GSAP animates in on each /hero fetch. -->
    <div class="hero__content">
      <div class="hero__eyebrow">
        <span class="hero__dot"></span>
        <span id="hero-source" class="hero__source">loading</span>
      </div>
      <h1 id="hero-tagline" class="hero__tagline">Tonight's your night.</h1>
      <p id="hero-subtitle" class="hero__subtitle">Your favorites are back.</p>
      <div class="hero__cta-row">
        <button id="hero-cta" class="hero__cta" type="button">
          <span class="hero__cta-icon" aria-hidden="true">▶</span>
          <span id="hero-cta-label" class="hero__cta-label">Watch now</span>
        </button>
        <button class="hero__cta hero__cta--ghost" type="button" aria-label="More info">
          <span aria-hidden="true">+ My List</span>
        </button>
      </div>
      <div class="hero__meta">
        <span id="hero-persona" class="hero__chip">persona</span>
        <span class="hero__dotsep">·</span>
        <span class="hero__rating">TV-14</span>
        <span class="hero__dotsep">·</span>
        <span class="hero__year">2026</span>
      </div>
    </div>

    <!-- Layer 3: status readout (dev convenience). -->
    <footer class="hero__footnote">
      <code id="hero-status">idle</code>
    </footer>
  </main>

  <script>
    (function () {
      const select = document.getElementById("canonical-select");
      const img = document.getElementById("hero-image");
      const tagline = document.getElementById("hero-tagline");
      const subtitle = document.getElementById("hero-subtitle");
      const ctaLabel = document.getElementById("hero-cta-label");
      const ctaBtn = document.getElementById("hero-cta");
      const source = document.getElementById("hero-source");
      const persona = document.getElementById("hero-persona");
      const status = document.getElementById("hero-status");

      // Encode an absolute path as a query string for the /image proxy.
      function imageURL(path) {
        return "/image?path=" + encodeURIComponent(path);
      }

      // Run the hero entrance timeline: Ken Burns restart + tagline sweep + CTA fade.
      function playEntrance() {
        // Reset Ken Burns by removing and re-adding the class.
        img.classList.remove("is-animating");
        void img.offsetWidth; // force reflow so animation restarts
        img.classList.add("is-animating");

        const tl = gsap.timeline({ defaults: { ease: "power3.out" } });
        tl.from(".hero__eyebrow", { y: -12, opacity: 0, duration: 0.5 }, 0.1);
        tl.from("#hero-tagline", {
          y: 60,
          opacity: 0,
          duration: 0.9,
          ease: "expo.out",
        }, 0.2);
        tl.from("#hero-subtitle", {
          y: 24,
          opacity: 0,
          duration: 0.7,
          ease: "power2.out",
        }, 0.55);
        tl.from("#hero-cta", {
          scale: 0.92,
          opacity: 0,
          duration: 0.55,
          ease: "back.out(1.6)",
        }, 0.85);
        tl.from(".hero__cta--ghost", {
          x: -14,
          opacity: 0,
          duration: 0.5,
          ease: "power2.out",
        }, 1.0);
        tl.from(".hero__meta > *", {
          y: 10,
          opacity: 0,
          duration: 0.45,
          stagger: 0.06,
          ease: "power1.out",
        }, 1.05);
      }

      // Fetch /hero/{canonical_id} and bind to the DOM, then fire entrance.
      async function loadHero(canonicalId) {
        status.textContent = "fetching " + canonicalId + "…";
        const started = performance.now();
        let data;
        try {
          const resp = await fetch("/hero/" + encodeURIComponent(canonicalId));
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          data = await resp.json();
        } catch (err) {
          status.textContent = "error: " + err.message;
          return;
        }

        // Preload the image before playing the entrance so the Ken Burns starts
        // on a real frame, not a blank scrim.
        const nextSrc = imageURL(data.image_path);
        const tmp = new Image();
        tmp.decoding = "async";
        tmp.onload = () => {
          img.src = nextSrc;
          tagline.textContent = data.tagline || "";
          subtitle.textContent = data.subtitle || "";
          ctaLabel.textContent = data.cta || "Watch now";
          source.textContent = data.source;
          const selectedPersona = select.selectedOptions[0]?.dataset.persona || "";
          persona.textContent = selectedPersona.toUpperCase();

          playEntrance();

          const ms = Math.round(performance.now() - started);
          status.textContent = data.source + " · " + ms + "ms";
        };
        tmp.onerror = () => {
          status.textContent = "image load failed: " + data.image_path;
        };
        tmp.src = nextSrc;
      }

      select.addEventListener("change", (e) => loadHero(e.target.value));
      ctaBtn.addEventListener("click", () => {
        gsap.fromTo(
          "#hero-cta",
          { scale: 0.94 },
          { scale: 1, duration: 0.35, ease: "back.out(2)" }
        );
      });

      // Initial load.
      if (select.value) loadHero(select.value);
    })();
  </script>
</body>
</html>
