command:
  - uvicorn
  - main:app
  - --host
  - 0.0.0.0
  - --port
  - "8080"

env:
  - name: CREATIVES_VOLUME_ROOT
    value: /Volumes/cme_outcomes_uswest/media_demo/creatives/heroes
  - name: AZURE_OPENAI_ENDPOINT
    value: https://lakefoundry-azure-openai.openai.azure.com/
  - name: AZURE_OPENAI_KEY
    valueFrom: azure_openai_key_secret
  - name: PGHOST
    valueFrom: lakebase_host
  - name: PGDATABASE
    valueFrom: lakebase_database
  - name: PGUSER
    valueFrom: lakebase_user
  - name: PGPASSWORD
    valueFrom: lakebase_password
